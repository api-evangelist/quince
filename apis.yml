description: >-
  Quince is a direct-to-consumer e-commerce retailer selling high-quality
  essentials at radical prices across apparel, home goods, bedding, furniture,
  accessories, jewelry, beauty, and travel. It uses a factory-direct model that
  bypasses traditional retail markups to offer affordable luxury. Quince was
  surfaced as a portfolio company of 8vc, GGV Capital, ICONIQ Capital, and
  Insight Partners and added to the API Evangelist network. As a consumer retail
  brand it publishes no public developer API, developer portal, or .well-known
  discovery surface; this profile captures its identity and domain-security
  posture.
